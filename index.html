<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171514;--card:#221f1d;--ink:#f1ece4;--sub:#a29b92;--line:#3a3532;--red:#f0877f;--green:#7cc79a;--accent:#e49a8f}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px;letter-spacing:.05em}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
select,button{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.stat{color:var(--sub);font-size:13px;margin:6px 0 10px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--green);width:0}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:4px;padding:20px 18px;min-height:230px;display:flex;flex-direction:column;justify-content:space-between}
.meta{color:var(--sub);font-size:12px}
.q{font-size:16px;margin:12px 0}
.a{font-size:26px;font-weight:700;color:var(--accent);margin:8px 0;min-height:44px}
.show{width:100%;padding:14px;font-size:16px;margin-top:12px}
.grade{display:flex;gap:10px;margin-top:12px}
.grade button{flex:1;padding:14px;font-size:17px;font-weight:700}
.ok{color:var(--green);border-color:var(--green)}.ng{color:var(--red);border-color:var(--red)}
.hide{display:none!important}
.end{text-align:center;padding:30px 10px}
.small{font-size:12px;color:var(--sub);margin-top:16px;text-align:center}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px;max-height:46vh;overflow-y:auto}
.prow{display:flex;gap:8px;margin-bottom:8px}
.chip{display:flex;align-items:center;gap:8px;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line)}
.chip input{width:18px;height:18px;accent-color:var(--accent)}
.chip small{color:var(--sub)}
</style>
</head>

[S35,148,"糸割符仲間には、のちに江戸・大坂の商人が加えられたが、これらの特定商人たちを総称して何と呼んだか。","五カ所商人"]

var K="nihonshi_v2";
var st={ng:{}};
try{var r=localStorage.getItem(K);if(r)st=JSON.parse(r)||st;if(!st.ng)st.ng={}}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}}
if(!st.mig)st.mig=0;
if(st.mig<1){var R=523,nn={};Object.keys(st.ng).forEach(function(k){k=+k;if(k<R)nn[k]=1;else if(k>R)nn[k-1]=1});st.ng=nn;st.mig=1;save()}
var $=function(i){return document.getElementById(i)};
var main=$("main");
var SECS=[];D.forEach(function(d){if(SECS.indexOf(d[0])<0)SECS.push(d[0])});
if(!st.off)st.off={};
var panel=$("panel");
function isOn(x){return !st.off[x]}
function btnText(){var n=SECS.filter(isOn).length;$("secbtn").textContent="単元: "+(n===SECS.length?"すべて":n+" / "+SECS.length+" 選択中")}
function drawPanel(){
  var h='<div class="prow"><button id="all1">すべて選択</button><button id="all0">すべて解除</button></div>';
  SECS.forEach(function(x,k){var c=D.filter(function(d){return d[0]===x}).length;h+='<label class="chip"><input type="checkbox" data-k="'+k+'"'+(isOn(x)?' checked':'')+'><span>'+x+' <small>'+c+'問</small></span></label>'});
  panel.innerHTML=h;
  $("all1").onclick=function(){st.off={};save();drawPanel();btnText();build()};
  $("all0").onclick=function(){SECS.forEach(function(x){st.off[x]=1});save();drawPanel();btnText();build()};
  Array.prototype.forEach.call(panel.querySelectorAll("input"),function(el){el.onchange=function(){var x=SECS[+el.getAttribute("data-k")];if(el.checked)delete st.off[x];else st.off[x]=1;save();btnText();build()}});
}
$("secbtn").onclick=function(){panel.classList.toggle("hide");this.className=panel.classList.contains("hide")?"":"on"};
var shuffle=false,weakOnly=false,list=[],i=0,done=0,right=0,shown=false;
function build(){
  list=D.map(function(d,n){return{id:n,d:d}}).filter(function(x){
    return isOn(x.d[0])&&(!weakOnly||st.ng[x.id]);
  });
  if(shuffle)for(var k=list.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=list[k];list[k]=list[j];list[j]=t}
  i=0;done=0;right=0;shown=false;render();
}
function render(){
  var n=Object.keys(st.ng).length;
  $("stat").textContent="苦手 "+n+"問 / 今回 "+done+"/"+list.length+"問 正解 "+right;
  $("bar").style.width=(list.length?done/list.length*100:0)+"%";
  if(!list.length){main.innerHTML='<div class="card end">'+(weakOnly?"苦手な問題はまだありません。":"問題がありません。")+'</div>';return}
  if(i>=list.length){
    main.innerHTML='<div class="card end"><div class="q">一周しました。<br>正解 '+right+' / '+list.length+'</div><button class="show" id="again">もう一度</button></div>';
    $("again").onclick=build;return;
  }
  var x=list[i],d=x.d;
  main.innerHTML='<div class="card"><div><div class="meta">'+d[0]+' / p.'+d[1]+(st.ng[x.id]?' / 苦手':'')+'</div><div class="q">'+d[2]+'</div></div><div class="a" id="ans">'+(shown?d[3]:"")+'</div></div>'+
   '<button class="show'+(shown?' hide':'')+'" id="sh">答えを見る</button>'+
   '<div class="grade'+(shown?'':' hide')+'"><button class="ng" id="bng">× 覚えてない</button><button class="ok" id="bok">○ 覚えた</button></div>';
  $("sh").onclick=function(){shown=true;render()};
  if(shown){$("bok").onclick=function(){grade(true)};$("bng").onclick=function(){grade(false)}}
}
function grade(ok){
  var id=list[i].id;
  if(ok){delete st.ng[id];right++}else st.ng[id]=1;
  save();done++;i++;shown=false;render();
}
$("shuf").onclick=function(){shuffle=!shuffle;this.textContent=shuffle?"ランダム":"順番どおり";this.className=shuffle?"on":"";build()};
$("weak").onclick=function(){weakOnly=!weakOnly;this.textContent=weakOnly?"苦手のみ":"全問";this.className=weakOnly?"on":"";build()};
$("reset").onclick=function(){if(confirm("苦手の記録をすべて消しますか?")){st={ng:{},off:{},mig:1};save();drawPanel();btnText();build()}};
drawPanel();btnText();build();
</script>
